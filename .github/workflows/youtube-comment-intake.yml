name: YouTube Panchang Comment Intake

on:
  schedule:
    # Poll every 15 minutes; keep the worker short and quota-aware.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pavitra-panchang-comment-intake
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
      TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REQUEST_HASH_SALT: ${{ secrets.REQUEST_HASH_SALT }}
    steps:
      # Validate before installing dependencies so a missing configuration
      # fails fast and reports every missing value in one actionable message.
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in CLIENT_SECRET_JSON TOKEN_JSON SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY REQUEST_HASH_SALT; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            echo "::error::Set these in Settings → Secrets and variables → Actions. See docs/worldwide-panchang-automation.md for Supabase setup. No comments were polled and no requests were queued."
            exit 1
          fi
          if [[ "${#REQUEST_HASH_SALT}" -lt 32 ]]; then
            echo "::error::REQUEST_HASH_SALT must be at least 32 characters. Generate a random secret and store it in GitHub Actions Secrets."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "::error::SUPABASE_URL must be the HTTPS project URL from Supabase Settings → API."
            exit 1
          fi
      - name: Validate Google OAuth token format
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          const raw = JSON.parse(process.env.TOKEN_JSON);
          const candidates = [raw, raw.tokens, raw.credentials, raw.oauth2?.credentials, typeof raw.token === 'object' ? raw.token : null].filter(Boolean);
          const token = candidates.find((item) => item.access_token || item.refresh_token || (typeof item.token === 'string' && item.token));
          if (!token) throw new Error('TOKEN_JSON has no usable Google OAuth token. The Make.com API key is a separate credential.');
          if (!token.refresh_token && !(token.access_token && token.expiry_date > Date.now())) throw new Error('TOKEN_JSON needs a refresh_token for reliable scheduled polling. Re-authorize with offline access.');
          const scopes = String(token.scope || (Array.isArray(token.scopes) ? token.scopes.join(' ') : ''));
          if (!scopes.includes('youtube.force-ssl') && !scopes.includes('youtube.readonly')) throw new Error('TOKEN_JSON is missing YouTube comment/channel read scopes.');
          console.log('Google OAuth token format and comment scopes are present.');
          NODE
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Python astronomy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-engine.txt
      - name: Write OAuth files
        shell: bash
        run: |
          umask 077
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
      - name: Poll and enqueue eligible requests
        run: node src/youtube/comment-poller.js
