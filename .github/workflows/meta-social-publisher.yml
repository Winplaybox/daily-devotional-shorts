name: Meta Social Publisher

on:
  workflow_run:
    workflows: ["Daily Shorts Publisher"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Daily Shorts Publisher run ID"
        required: true
        type: string
      run_number:
        description: "Source Daily Shorts Publisher run number (used in the artifact name)"
        required: true
        type: string
      publish:
        description: "Confirm publishing to Instagram and Facebook"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: meta-publisher-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'schedule' &&
       vars.AUTO_PUBLISH == 'true' &&
       vars.META_AUTO_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout publishing code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate publisher script syntax
        run: node --check scripts/publish_meta.js

      - name: Verify source YouTube uploads before distribution
        id: verify-source
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number || inputs.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-youtube-source-run.js

      - name: Download the source run's render artifact
        uses: actions/download-artifact@v4
        with:
          name: pavitra-panchang-${{ steps.verify-source.outputs.run_number }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out

      - name: Verify the 40-second MP4
        shell: bash
        run: test -s out/pavitra-panchang-40s.mp4

      - name: Publish to Instagram and Facebook
        env:
          META_VIDEO_PATH: out/pavitra-panchang-40s.mp4
          META_RUN_KEY: ${{ github.event.workflow_run.id || inputs.run_id }}-attempt-${{ github.run_attempt }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v25.0' }}
          META_CAPTION: ${{ vars.META_CAPTION || '' }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ vars.SUPABASE_META_BUCKET || 'meta-publishing' }}
        run: node scripts/publish_meta.js
