name: Daily Shorts Publisher

on:
  schedule:
    # 06:00 IST production; schedule the target date three calendar days ahead.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to YouTube (explicitly enable for this run; default is review-only)"
        required: true
        default: false
        type: boolean
      panchang_date:
        description: "Optional exact Panchang/publication date YYYY-MM-DD (overrides the rolling buffer)"
        required: false
        type: string
      publish_at:
        description: "Optional ISO-8601 timestamp for one-off catch-up scheduling of the selected slot"
        required: false
        type: string
      publish_slot:
        description: "Slot that receives the one-off publish_at override"
        required: false
        default: morning
        type: choice
        options:
          - morning
          - afternoon
          - evening

permissions:
  contents: read

concurrency:
  group: pavitra-panchang-daily-publisher
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PANCHANG_DATE: ${{ inputs.panchang_date || '' }}
      PANCHANG_PUBLISH_AT: ${{ inputs.publish_at || '' }}
      PANCHANG_PUBLISH_OVERRIDE_SLOT: ${{ inputs.publish_slot || 'morning' }}
      PANCHANG_PUBLISH_BUFFER_DAYS: ${{ vars.PANCHANG_PUBLISH_BUFFER_DAYS || '3' }}
      PANCHANG_SCHEDULE_TIMEZONE: ${{ vars.PANCHANG_SCHEDULE_TIMEZONE || 'Asia/Kolkata' }}
      PANCHANG_LAT: ${{ vars.PANCHANG_LAT || '23.1765' }}
      PANCHANG_LON: ${{ vars.PANCHANG_LON || '75.7885' }}
      PANCHANG_TZ: ${{ vars.PANCHANG_TZ || '5.5' }}
      PANCHANG_LOCATION: ${{ vars.PANCHANG_LOCATION || 'Ujjain, Madhya Pradesh, India (India reference)' }}
      PANCHANG_TIMEZONE_LABEL: ${{ vars.PANCHANG_TIMEZONE_LABEL || 'IST' }}
      PANCHANG_LOCATION_MODE: ${{ vars.PANCHANG_LOCATION_MODE || 'india_reference' }}
      # Ujjain India-reference is the channel's production location; repository variables may override it.
      PANCHANG_LOCATION_CONFIGURED: 'true'
      # Never publish from a cron by default. A manual dispatch must explicitly set publish=true.
      AUTO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
      REQUEST_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
      TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements-engine.txt edge-tts

      - name: Resolve exact Panchang publication date
        shell: bash
        run: |
          set -euo pipefail
          python -m engine.publish_buffer \
            --days "$PANCHANG_PUBLISH_BUFFER_DAYS" \
            --timezone "$PANCHANG_SCHEDULE_TIMEZONE" \
            --date-override "$PANCHANG_DATE" \
            --github-env "$GITHUB_ENV"

      - name: Validate source
        env:
          # Fixed, explicit fixture coordinates keep offline tests deterministic.
          # These values are never used for public publishing.
          PANCHANG_LAT: "23.1765"
          PANCHANG_LON: "75.7885"
          PANCHANG_TZ: "5.5"
          PANCHANG_LOCATION: "Ujjain, India (test fixture only)"
        run: |
          npm run check
          npm test
          python -m py_compile engine/*.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate resolved date and publish time
        run: |
          python - <<'PY'
          import datetime, os
          datetime.date.fromisoformat(os.environ['PANCHANG_DATE'])
          value = os.environ.get('PANCHANG_PUBLISH_AT', '').strip()
          if value:
              parsed = datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
              if parsed.tzinfo is None:
                  raise SystemExit('PANCHANG_PUBLISH_AT must include Z or an explicit UTC offset')
          PY

      - name: Validate publishing configuration
        if: env.REQUEST_UPLOAD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLIENT_SECRET_JSON" ]] || { echo "::error::Missing Actions secret CLIENT_SECRET_JSON"; exit 1; }
          [[ -n "$TOKEN_JSON" ]] || { echo "::error::Missing Actions secret TOKEN_JSON"; exit 1; }
          [[ -n "$GEMINI_API_KEY" ]] || echo "::warning::GEMINI_API_KEY is empty; Edge TTS fallback will be used."
          python - <<'PY'
          import json, os
          for key in ("CLIENT_SECRET_JSON", "TOKEN_JSON"):
              try:
                  value = json.loads(os.environ[key])
              except Exception as exc:
                  raise SystemExit(f"{key} is not valid JSON: {exc}")
              if key == "CLIENT_SECRET_JSON":
                  conf = value.get("installed") or value.get("web") or value
                  if not conf.get("client_id") or not conf.get("client_secret"):
                      raise SystemExit("CLIENT_SECRET_JSON must contain client_id and client_secret.")
              elif not any((value.get(k) or (value.get("tokens") or {}).get(k) or (value.get("credentials") or {}).get(k)) for k in ("refresh_token", "access_token", "token")):
                  raise SystemExit("TOKEN_JSON must contain a Google OAuth refresh_token or access_token (root, tokens, or credentials object).")
          PY

      - name: Validate explicit production Panchang location
        if: env.REQUEST_UPLOAD == 'true' && env.AUTO_PUBLISH == 'true'
        run: python -m engine.publish_location

      - name: Write OAuth files
        if: env.REQUEST_UPLOAD == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json

      - name: Render and optionally publish all three daily slots
        run: npm start

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pavitra-panchang-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.json
          if-no-files-found: warn
          retention-days: 14
