name: Make Social Publisher

on:
  workflow_run:
    workflows: ["Daily Shorts Publisher"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Daily Shorts Publisher run ID"
        required: true
        type: string
      run_number:
        description: "Source Daily Shorts Publisher run number"
        required: true
        type: string
      publish:
        description: "Confirm sending the 40-second Short to Make.com"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: make-social-publisher-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'schedule' &&
       vars.AUTO_PUBLISH == 'true' &&
       vars.MAKE_SOCIAL_AUTO_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publishing code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Make publisher script syntax
        run: node --check scripts/publish_make_social.js

      - name: Verify source YouTube uploads before distribution
        id: verify-source
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number || inputs.run_number }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-youtube-source-run.js

      - name: Download source render artifact
        uses: actions/download-artifact@v4
        with:
          name: pavitra-panchang-${{ steps.verify-source.outputs.run_number }}
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out

      - name: Verify 40-second video and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s out/pavitra-panchang-40s.mp4
          test -s out/daily_props.json
          node -e "JSON.parse(require('fs').readFileSync('out/daily_props.json','utf8'));"

      - name: Upload media and dispatch Make scenario
        env:
          META_VIDEO_PATH: out/pavitra-panchang-40s.mp4
          PANCHANG_METADATA_PATH: out/daily_props.json
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number || inputs.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MAKE_SOCIAL_WEBHOOK_URL: ${{ secrets.MAKE_SOCIAL_WEBHOOK_URL }}
          MAKE_SOCIAL_WEBHOOK_API_KEY: ${{ secrets.MAKE_SOCIAL_WEBHOOK_API_KEY }}
          MAKE_SOCIAL_CAPTION: ${{ vars.MAKE_SOCIAL_CAPTION || '' }}
          MAKE_SOCIAL_PUBLISH_MODE: ${{ vars.MAKE_SOCIAL_PUBLISH_MODE || 'publish_now' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SOCIAL_BUCKET: ${{ vars.SUPABASE_SOCIAL_BUCKET || 'social-publishing' }}
        run: node scripts/publish_make_social.js
