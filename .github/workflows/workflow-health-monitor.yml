name: Workflow Schedule Health Monitor

on:
  schedule:
    # Run twice per hour so the 45-minute comment-intake threshold is not hidden by an hourly check.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pavitra-workflow-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check scheduled workflow freshness
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-workflow-health.js
