name: Daily Shorts Publisher
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 0 * * *'  # 06:00 AM IST
    - cron: '0 7 * * *'   # 12:30 PM IST
    - cron: '0 13 * * *'  # 06:30 PM IST
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing slot (morning, afternoon, evening, auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - afternoon
          - evening

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Devanagari Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-indic

      - name: Install Dependencies
        run: npm install

      - name: Generate Devotional Ambient Audio
        run: python scripts/generate_audio.py

      - name: Restore YouTube Tokens
        env:
          CLIENT_SECRET_RAW: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_RAW: ${{ secrets.TOKEN_JSON }}
        run: |
          if [ -n "$CLIENT_SECRET_RAW" ]; then
            printf "%s" "$CLIENT_SECRET_RAW" > client_secret.json
            echo "Restored client_secret.json successfully"
          fi
          if [ -n "$TOKEN_RAW" ]; then
            printf "%s" "$TOKEN_RAW" > token.json
            echo "Restored token.json successfully"
          fi

      - name: Run Pipeline
        run: node src/pipeline.js
        env:
          SLOT: ${{ github.event.inputs.slot || 'auto' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
