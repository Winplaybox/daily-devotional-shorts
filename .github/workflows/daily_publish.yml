name: Daily Shorts Publisher
on:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST: daily review batch
  workflow_dispatch:
    inputs:
      slot:
        description: 'Panchang publishing slot'
        required: true
        default: 'morning'
        type: choice
        options: [morning, afternoon, evening]
      publish:
        description: 'Upload and schedule on YouTube (requires AUTO_PUBLISH repository variable true)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-panchang-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Devanagari Fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-indic
      - name: Install Dependencies
        run: npm ci
      - name: Generate Devotional Ambient Audio
        run: python scripts/generate_audio.py
      - name: Restore YouTube Tokens
        if: vars.AUTO_PUBLISH == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          CLIENT_SECRET_RAW: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_RAW: ${{ secrets.TOKEN_JSON }}
        run: |
          test -n "$CLIENT_SECRET_RAW" || { echo "::error::Missing CLIENT_SECRET_JSON secret"; exit 1; }
          test -n "$TOKEN_RAW" || { echo "::error::Missing TOKEN_JSON secret"; exit 1; }
          printf "%s" "$CLIENT_SECRET_RAW" > client_secret.json
          printf "%s" "$TOKEN_RAW" > token.json
          node -e "JSON.parse(require('fs').readFileSync('client_secret.json')); JSON.parse(require('fs').readFileSync('token.json'));"
          echo "YouTube OAuth JSON files restored and parsed."
      - name: Run Pipeline
        run: node src/pipeline.js
        env:
          SLOT: ${{ inputs.slot || 'morning' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
          REQUEST_UPLOAD: ${{ github.event_name == 'schedule' || inputs.publish }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PANCHANG_LAT: ${{ vars.PANCHANG_LAT || '23.1765' }}
          PANCHANG_LON: ${{ vars.PANCHANG_LON || '75.7885' }}
          PANCHANG_TZ: ${{ vars.PANCHANG_TZ || '5.5' }}
          PANCHANG_LOCATION: ${{ vars.PANCHANG_LOCATION || 'Ujjain, India' }}
          PANCHANG_TIMEZONE_LABEL: ${{ vars.PANCHANG_TIMEZONE_LABEL || 'IST' }}
      - name: Upload rendered videos for review
        uses: actions/upload-artifact@v4
        with:
          name: daily-panchang-${{ github.run_id }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 7
