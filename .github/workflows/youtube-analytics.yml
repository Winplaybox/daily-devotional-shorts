name: YouTube Analytics Report

on:
  schedule:
    # Daily at 09:30 IST; reports cover completed UTC days through yesterday.
    - cron: "0 4 * * *"
    # Redundant off-peak trigger: GitHub drops busy schedules (4 AM UTC was missed on 2026-11-14).
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Completed UTC days to report (1-90)"
        required: true
        default: "90"
        type: string

permissions:
  # write is used ONLY to commit analytics history to the isolated
  # `analytics-data` branch; no workflow here pushes to main.
  contents: write

concurrency:
  group: pavitra-youtube-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
      TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      ANALYTICS_DAYS: ${{ inputs.days || '90' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate OAuth configuration without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLIENT_SECRET_JSON" ]] || { echo "::error::Missing CLIENT_SECRET_JSON"; exit 1; }
          [[ -n "$TOKEN_JSON" ]] || { echo "::error::Missing TOKEN_JSON"; exit 1; }
          node --input-type=module - <<'NODE'
          const client = JSON.parse(process.env.CLIENT_SECRET_JSON);
          const conf = client.installed || client.web || client;
          if (!conf.client_id || !conf.client_secret) throw new Error('OAuth client JSON is missing required fields');
          const rawToken = JSON.parse(process.env.TOKEN_JSON);
          const candidates = [rawToken, rawToken.tokens, rawToken.credentials, rawToken.oauth2?.credentials, typeof rawToken.token === 'object' ? rawToken.token : null].filter(Boolean);
          const token = candidates.find((item) => item.access_token || item.refresh_token || (typeof item.token === 'string' && item.token));
          if (!token) throw new Error('TOKEN_JSON has no usable Google OAuth token. Do not use the Make.com API key here.');
          const scopes = String(token.scope || (Array.isArray(token.scopes) ? token.scopes.join(' ') : ''));
          if (!scopes.includes('yt-analytics.readonly')) throw new Error('TOKEN_JSON does not list yt-analytics.readonly; re-authorize locally and update the Actions secret.');
          console.log('OAuth JSON structure and Analytics scope are present.');
          NODE
      - name: Write temporary OAuth files
        shell: bash
        run: |
          umask 077
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
      - name: Collect channel analytics
        run: npm run analytics:report
      - name: Upload analytics report
        uses: actions/upload-artifact@v4
        with:
          name: pavitra-youtube-analytics-${{ github.run_number }}
          path: out/analytics/*
          if-no-files-found: error
          retention-days: 90
      - name: Persist durable metrics history (analytics-data branch)
        shell: bash
        run: |
          set -euo pipefail
          report="$(ls -1 out/analytics/youtube-analytics-*.json | tail -n 1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin analytics-data >/dev/null 2>&1; then
            git fetch --depth=1 origin analytics-data
            git worktree add history FETCH_HEAD
            cd history && git checkout -B analytics-data && cd ..
          else
            git worktree add --detach history
            cd history && git checkout --orphan analytics-data && git rm -rf . >/dev/null 2>&1 || true && cd ..
          fi
          node scripts/analytics-history.mjs "$report" history
          cd history
          git add -A
          if git diff --cached --quiet; then echo "No history changes."; exit 0; fi
          git commit -m "analytics: update metrics history $(date -u +%F)"
          git push origin analytics-data
