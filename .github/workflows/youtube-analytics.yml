name: YouTube Analytics Report

on:
  schedule:
    # Daily at 09:30 IST; reports cover completed UTC days through yesterday.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Completed UTC days to report (1-90)"
        required: true
        default: "28"
        type: string

permissions:
  contents: read

concurrency:
  group: pavitra-youtube-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
      TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
      ANALYTICS_DAYS: ${{ inputs.days || '28' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate OAuth configuration without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLIENT_SECRET_JSON" ]] || { echo "::error::Missing CLIENT_SECRET_JSON"; exit 1; }
          [[ -n "$TOKEN_JSON" ]] || { echo "::error::Missing TOKEN_JSON"; exit 1; }
          node --input-type=module - <<'NODE'
          const client = JSON.parse(process.env.CLIENT_SECRET_JSON);
          const conf = client.installed || client.web || client;
          if (!conf.client_id || !conf.client_secret) throw new Error('OAuth client JSON is missing required fields');
          const token = JSON.parse(process.env.TOKEN_JSON);
          if (!token.refresh_token && !token.access_token && !token.token) throw new Error('OAuth token JSON has no usable token');
          const scopes = String(token.scope || (Array.isArray(token.scopes) ? token.scopes.join(' ') : ''));
          if (!scopes.includes('yt-analytics.readonly')) throw new Error('TOKEN_JSON does not list yt-analytics.readonly; re-authorize locally and update the Actions secret.');
          console.log('OAuth JSON structure and Analytics scope are present.');
          NODE
      - name: Write temporary OAuth files
        shell: bash
        run: |
          umask 077
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
      - name: Collect channel analytics
        run: npm run analytics:report
      - name: Upload analytics report
        uses: actions/upload-artifact@v4
        with:
          name: pavitra-youtube-analytics-${{ github.run_number }}
          path: out/analytics/*
          if-no-files-found: error
          retention-days: 90
